# Service import for ONE Zerops project. Import this same file SEPARATELY into both
# projects: mini-obieraki-dev and mini-obieraki-prod (project panel → Import services).
# Environment isolation is at the project level (separate private network and secrets),
# so the service names are identical in both.
services:
  # PostgreSQL — created upfront as infra. The backend will start using it only after the
  # server/database.py fix (for now the code writes to SQLite). `:single` is enough to
  # start; on prod it can later be bumped to `postgresql:ha@16`.
  - hostname: db
    type: postgresql:single@16

  # FastAPI backend. enableSubdomainAccess gives a public api-*.zerops.app address (Swagger /docs).
  - hostname: api
    type: ubuntu/python@3.12
    enableSubdomainAccess: true
    minContainers: 1

  # Flutter web frontend (statics, nginx).
  - hostname: web
    type: static
    enableSubdomainAccess: true
